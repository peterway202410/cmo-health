name: 缺陷报告
description: 页面报错、计算不对、导入导出失败等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量写清怎么复现。涉及真实健康数据时，请打码或改成示例数字。
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - H5（GitHub Pages Demo）
        - H5（本地 npm run dev:h5）
        - 微信小程序
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 填写……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: v0.1.0 或 commit hash
